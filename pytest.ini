[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::pytest_asyncio.plugin.PytestDeprecationWarning
    ignore::DeprecationWarning:pytest_asyncio.plugin
    ignore::DeprecationWarning:asyncio.get_event_loop_policy
    ignore::DeprecationWarning:datetime.datetime.utcnow
    ignore::RuntimeWarning:LIVE_TRADING_ENABLED
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore::DeprecationWarning:jose.jwt
    ignore::DeprecationWarning:jose.utils
    ignore::RuntimeWarning:pydantic